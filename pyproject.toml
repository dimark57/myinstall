[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myinstall"
description = "Shared runtime installer and secret lifecycle manager"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
myinstall = "myinstall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "myinstall.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
